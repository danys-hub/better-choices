<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teamlyzer · Company Data Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0b0d10;
      --surface:   #13161b;
      --border:    #222630;
      --accent:    #00e5a0;
      --accent2:   #005cff;
      --warn:      #ffb800;
      --text:      #e2e8f0;
      --muted:     #5a6478;
      --row-hover: #181c24;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .logo {
      font-family: var(--sans);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--accent);
    }
    .logo span { color: var(--text); }

    .tagline {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    /* ── Sort legend ── */
    .sort-legend {
      max-width: 1100px;
      margin: 0 auto 0.8rem;
      display: flex;
      gap: 1.5rem;
      font-size: 0.68rem;
      color: var(--muted);
      flex-wrap: wrap;
      align-items: center;
    }

    .sort-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .sort-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-primary   { background: var(--accent); }
    .dot-secondary { background: var(--accent2); }

    .sort-pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .pill-primary   { background: rgba(0,229,160,0.12); color: var(--accent);  border: 1px solid rgba(0,229,160,0.25); }
    .pill-secondary { background: rgba(0,92,255,0.12);  color: #5b8fff;        border: 1px solid rgba(0,92,255,0.25); }

    .sort-hint { color: var(--muted); font-size: 0.65rem; margin-left: auto; }

    /* ── Toolbar ── */
    .table-toolbar {
      max-width: 1100px;
      margin: 0 auto 0.8rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    #search {
      font-family: var(--mono);
      font-size: 0.78rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 4px;
      width: 240px;
      transition: border-color 0.15s;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { outline: none; border-color: var(--accent); }

    .row-count {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── Table ── */
    .table-wrap {
      max-width: 1100px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    thead { background: var(--surface); position: sticky; top: 0; z-index: 2; }

    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
      position: relative;
    }
    th:hover { color: var(--text); }

    /* rank indicator strip at bottom of header cell */
    th::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 1px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    th.primary-sort::after   { background: var(--accent);  opacity: 1; }
    th.secondary-sort::after { background: var(--accent2); opacity: 1; }

    th .sort-icon { margin-left: 0.3rem; font-style: normal; opacity: 0.35; font-size: 0.7rem; }
    th.primary-sort .sort-icon   { opacity: 1; color: var(--accent); }
    th.secondary-sort .sort-icon { opacity: 1; color: #5b8fff; }

    /* rank number badge on header */
    th .rank-badge {
      display: none;
      font-size: 0.55rem;
      font-weight: 700;
      vertical-align: super;
      margin-left: 0.2rem;
      opacity: 0.8;
    }
    th.primary-sort .rank-badge   { display: inline; color: var(--accent); }
    th.secondary-sort .rank-badge { display: inline; color: #5b8fff; }

    td {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--row-hover); }

    .company-cell a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    .company-cell a:hover { color: var(--accent); text-decoration: underline; }

    .salary-cell { white-space: nowrap; }
    .hours-cell  { color: var(--warn); }
    .na          { color: var(--muted); font-size: 0.72rem; }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .row-in { animation: rowIn 0.25s ease both; }

    #empty {
      max-width: 1100px;
      margin: 3rem auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      display: none;
    }
    #empty.visible { display: block; }

    /* ── Loading / error states ── */
    #load-state {
      max-width: 1100px;
      margin: 2rem auto;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Team<span>lyzer</span> Explorer</div>
    <div class="tagline">Real-time company data · Portugal</div>
  </div>
</header>

<!-- Sort legend -->
<div class="sort-legend">
  <span class="sort-badge">
    <span class="dot dot-primary"></span>
    Primary sort:&nbsp;<span class="sort-pill pill-primary" id="legend-primary">—</span>
  </span>
  <span class="sort-badge">
    <span class="dot dot-secondary"></span>
    Secondary sort:&nbsp;<span class="sort-pill pill-secondary" id="legend-secondary">—</span>
  </span>
  <span class="sort-hint">Click column to set primary · Shift+click to set secondary</span>
</div>

<div class="table-toolbar">
  <input type="text" id="search" placeholder="Filter companies…" autocomplete="off">
  <span class="row-count" id="row-count">— companies</span>
</div>

<div id="load-state">Loading realyzer.csv…</div>

<div class="table-wrap" style="display:none" id="table-wrap">
  <table>
    <thead>
      <tr>
        <th data-col="company">Company <i class="sort-icon">⇅</i><sup class="rank-badge"></sup></th>
        <th data-col="salary_range">Salary Range <i class="sort-icon">⇅</i><sup class="rank-badge"></sup></th>
        <th data-col="avg_hours">Avg. Hours <i class="sort-icon">⇅</i><sup class="rank-badge"></sup></th>
        <th data-col="url" style="cursor:default">Link</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="empty">No results match your filter.</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const CSV_FILE = 'realyzer.csv';

let allRows  = [];   // raw parsed rows
let filterQ  = '';

// Two-level sort: each entry is { col, dir }
let sortStack = [
  { col: 'company', dir: 'asc' },   // primary
  { col: null,      dir: 'asc' },   // secondary (none)
];

// ─────────────────────────────────────────────
// DOM
// ─────────────────────────────────────────────
const tbody      = document.getElementById('tbody');
const rowCount   = document.getElementById('row-count');
const searchEl   = document.getElementById('search');
const loadState  = document.getElementById('load-state');
const tableWrap  = document.getElementById('table-wrap');
const emptyEl    = document.getElementById('empty');
const legPrimary = document.getElementById('legend-primary');
const legSecond  = document.getElementById('legend-secondary');

// ─────────────────────────────────────────────
// CSV PARSER  (handles quoted fields)
// ─────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];

  function splitLine(line) {
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        fields.push(cur.trim()); cur = '';
      } else {
        cur += ch;
      }
    }
    fields.push(cur.trim());
    return fields;
  }

  const headers = splitLine(lines[0]).map(h => h.toLowerCase().replace(/\s+/g, '_'));
  return lines.slice(1).map(line => {
    const vals = splitLine(line);
    const obj  = {};
    headers.forEach((h, i) => obj[h] = vals[i] ?? '');
    return obj;
  });
}

// ─────────────────────────────────────────────
// VALUE CONVERTERS  (for numeric sorting)
// ─────────────────────────────────────────────
function salaryToNum(s) {
  if (!s) return -Infinity;
  const nums = s.replace(/\./g, '').match(/\d+/g);
  return nums ? +nums[0] : -Infinity;
}

function hoursToNum(h) {
  if (!h) return -Infinity;
  const [hh, mm] = (h || '').split(':');
  return (+hh || 0) * 60 + (+mm || 0);
}

function colValue(row, col) {
  if (col === 'salary_range') return salaryToNum(row.salary_range);
  if (col === 'avg_hours')    return hoursToNum(row.avg_hours);
  return (row[col] || '').toLowerCase();
}

// ─────────────────────────────────────────────
// SORT + FILTER
// ─────────────────────────────────────────────
function getFiltered() {
  const q = filterQ.toLowerCase();
  return q
    ? allRows.filter(r => (r.company || '').toLowerCase().includes(q))
    : allRows.slice();
}

function getSorted(arr) {
  return arr.slice().sort((a, b) => {
    for (const { col, dir } of sortStack) {
      if (!col) continue;
      const va = colValue(a, col);
      const vb = colValue(b, col);
      let cmp = 0;
      if (typeof va === 'string') cmp = va.localeCompare(vb);
      else cmp = va - vb;
      if (cmp !== 0) return dir === 'asc' ? cmp : -cmp;
    }
    return 0;
  });
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
const BASE = 'https://pt.teamlyzer.com';

function renderTable() {
  const rows = getSorted(getFiltered());
  rowCount.textContent = `${rows.length} compan${rows.length === 1 ? 'y' : 'ies'}`;

  tbody.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.className = 'row-in';
    tr.style.animationDelay = `${Math.min(i, 40) * 12}ms`;

    const slug    = r.slug || '';
    const name    = r.company || slug;
    const salary  = r.salary_range || '';
    const hours   = r.avg_hours || '';
    const linkUrl = r.url || (slug ? `${BASE}/companies/${slug}` : '');

    tr.innerHTML = `
      <td class="company-cell">
        ${linkUrl
          ? `<a href="${linkUrl}" target="_blank" rel="noopener">${name}</a>`
          : name}
      </td>
      <td class="salary-cell">${salary || '<span class="na">n/a</span>'}</td>
      <td class="hours-cell">${hours   || '<span class="na">n/a</span>'}</td>
      <td>${linkUrl
        ? `<a href="${linkUrl}" target="_blank" rel="noopener" style="color:var(--accent2);font-size:0.7rem">↗ open</a>`
        : '<span class="na">—</span>'}</td>
    `;
    tbody.appendChild(tr);
  });

  emptyEl.classList.toggle('visible', rows.length === 0 && filterQ.length > 0);
}

// ─────────────────────────────────────────────
// HEADER STATE
// ─────────────────────────────────────────────
const COL_LABELS = {
  company:      'Company',
  salary_range: 'Salary',
  avg_hours:    'Avg. Hours',
};

function updateHeaders() {
  const [primary, secondary] = sortStack;

  document.querySelectorAll('th[data-col]').forEach(th => {
    const col = th.dataset.col;
    th.classList.remove('primary-sort', 'secondary-sort');

    const icon  = th.querySelector('.sort-icon');
    const badge = th.querySelector('.rank-badge');

    // reset
    if (icon)  icon.textContent  = '⇅';
    if (badge) badge.textContent = '';

    if (col === primary.col) {
      th.classList.add('primary-sort');
      if (icon)  icon.textContent  = primary.dir === 'asc' ? '↑' : '↓';
      if (badge) badge.textContent = '1';
    } else if (secondary.col && col === secondary.col) {
      th.classList.add('secondary-sort');
      if (icon)  icon.textContent  = secondary.dir === 'asc' ? '↑' : '↓';
      if (badge) badge.textContent = '2';
    }
  });

  // legend
  legPrimary.textContent = primary.col
    ? `${COL_LABELS[primary.col] ?? primary.col} ${primary.dir === 'asc' ? '↑' : '↓'}`
    : '—';
  legSecond.textContent = secondary.col
    ? `${COL_LABELS[secondary.col] ?? secondary.col} ${secondary.dir === 'asc' ? '↑' : '↓'}`
    : 'none';
}

// ─────────────────────────────────────────────
// SORT CLICK HANDLER
// ─────────────────────────────────────────────
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', e => {
    const col = th.dataset.col;
    if (col === 'url') return;

    const [primary, secondary] = sortStack;

    if (e.shiftKey) {
      // ── Set / toggle secondary ──
      if (secondary.col === col) {
        // toggle direction or clear if same dir again
        if (secondary.dir === 'asc') {
          sortStack[1] = { col, dir: 'desc' };
        } else {
          sortStack[1] = { col: null, dir: 'asc' };
        }
      } else {
        sortStack[1] = { col, dir: 'asc' };
      }
    } else {
      // ── Set / toggle primary ──
      if (primary.col === col) {
        sortStack[0] = { col, dir: primary.dir === 'asc' ? 'desc' : 'asc' };
      } else {
        // Demote old primary to secondary only if new col isn't already secondary
        const newSecondary = (secondary.col !== col && primary.col)
          ? { col: primary.col, dir: primary.dir }
          : secondary;
        sortStack = [{ col, dir: 'asc' }, newSecondary];
      }
      // Don't allow primary === secondary
      if (sortStack[1].col === sortStack[0].col) {
        sortStack[1] = { col: null, dir: 'asc' };
      }
    }

    updateHeaders();
    renderTable();
  });
});

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
searchEl.addEventListener('input', () => {
  filterQ = searchEl.value.trim();
  renderTable();
});

// ─────────────────────────────────────────────
// LOAD CSV
// ─────────────────────────────────────────────
fetch(CSV_FILE)
  .then(r => {
    if (!r.ok) throw new Error(`Could not load ${CSV_FILE} (HTTP ${r.status})`);
    return r.text();
  })
  .then(text => {
    allRows = parseCSV(text);
    loadState.style.display = 'none';
    tableWrap.style.display = '';
    updateHeaders();
    renderTable();
  })
  .catch(err => {
    loadState.innerHTML = `
      <span style="color:#ff5252">⚠ ${err.message}</span><br>
      <span style="font-size:0.7rem;color:var(--muted)">
        Make sure <code>realyzer.csv</code> is in the same folder as this HTML file,
        and open via a local server (e.g. <code>python -m http.server</code>).
      </span>`;
  });
</script>
</body>
</html>
